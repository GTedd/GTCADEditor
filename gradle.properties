# Project. One version for the mod and the plugin: they must come from the same sources, the protocol has no version.
# <upstream CAD Editor version>+gt.<revision of this fork>
version=0.99.9+gt.1
group=dev.rinorsi.editor
# Upstream CAD-Editor-Recast commit the editor sources were taken from (0.99.9).
upstream_commit=50723fb
java_version=25

# Minecraft and Fabric (the only mod target), see https://fabricmc.net/develop/
minecraft_version=26.3
fabric_minecraft_version=~26.3
fabric_loader_version=0.19.5
fabric_version=0.161.0+26.3

# Oriel UI (the editor's page engine), the slim 0.15.0 build of D:\已完成构建mod\GTOrielUI. Publish it once there with
#   ./gradlew :client:publishAllPublicationsToTemplateLocalRepository -Poriel_slim
# or point orielRepository at any Maven directory that has dev.oriel:oriel-fabric-26.3:0.15.0 (MavenLocal also works).
oriel_version=0.15.0
orielRepository=../GTOrielUI/build/template-maven
# Ship Oriel inside the mod jar (jar-in-jar), so players install one file. false: Oriel is installed separately.
orielEmbedded=true

# Paper (the plugin), newest 26.3 -stable dev bundle (not <latest>, that is the next pre-release), see
# https://repo.papermc.io/repository/maven-public/io/papermc/paper/dev-bundle/maven-metadata.xml
paper_version=26.3.build.249-stable
junit_version=6.1.3

org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
