[true, false].each { clientSide ->
    def side = clientSide ? 'client' : 'server'
    verify(clientSide ? 'entitySchemaTest' : 'entitySchemaServerTest', 'dev.rinorsi.editor.registry.EntitySchemaTest') {
        jvmArgs('-Dcadeditor.schema.client=' + clientSide)
        args(new File(reports, "entity-schema-${side}.json").absolutePath)
    }
    verify(clientSide ? 'entitySchemaDetailsTest' : 'entitySchemaDetailsServerTest', 'dev.rinorsi.editor.registry.EntitySchemaDetailsTest') {
        jvmArgs('-Dcadeditor.schema.client=' + clientSide)
        args(new File(reports, "entity-schema-details-${side}.json").absolutePath)
    }
}
