// The editor's headless regression programs (main() methods that throw on failure) on the real game classes: codecs,
// schemas, world/vault editing, client-side state. Nothing here ships in the jar. JUnit tests run in :client:test.
def scratch = layout.buildDirectory.dir('verification').get().asFile
def reports = layout.buildDirectory.dir('reports/verification').get().asFile
def pinyin = project.file('src/main/resources/assets/cadeditor/ui/js/pinyin-data.js').absolutePath
def clientSources = project.file('src/main/java').absolutePath

def verify = { String name, String mainClassName, Closure configure = {} ->
    def task = tasks.register(name, JavaExec) {
        group = 'verification'
        dependsOn('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = mainClassName
        // Several programs read sources and catalogs by repository-relative path.
        workingDir = rootProject.projectDir
        jvmArgs('-Djava.awt.headless=true')
        doFirst { scratch.mkdirs(); reports.mkdirs() }
    }
    task.configure(configure)
    tasks.named('check') { dependsOn(task) }
    task
}

